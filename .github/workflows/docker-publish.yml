name: Docker Publish

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: CHECK UPSTREAM VERSION
  # -------------------------------------------------------------------------
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout or API calls
      packages: read # Required to check existing images in GHCR
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      version: ${{ steps.check.outputs.version }}
      calver: ${{ steps.check.outputs.calver }}
      commit: ${{ steps.check.outputs.commit }}
      image_name_lower: ${{ steps.lowercase.outputs.image_name }}
    steps:
      # REQUIRED FIX: Docker registries crash on capital letters.
      - name: Lowercase Image Name
        id: lowercase
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login to Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Upstream & Registry
        id: check
        run: |
          echo "Checking latest VSCode Insiders commit..."

          # 1. Fetch latest commit hash for Insiders (canonicalized to linux-x64)
          UPSTREAM_COMMIT=$(curl -sf "https://update.code.visualstudio.com/api/commits/insider/linux-x64" | jq -r '.[0]')

          if [ -z "$UPSTREAM_COMMIT" ] || [ "$UPSTREAM_COMMIT" == "null" ]; then
            echo "::error::Could not fetch VSCode Insiders commit hash"
            exit 1
          fi

          SHORT_COMMIT=${UPSTREAM_COMMIT:0:7}
          CALVER=$(date +%Y.%m.%d)
          VERSION="${CALVER}-${SHORT_COMMIT}"

          echo "Latest VSCode Insiders commit: $UPSTREAM_COMMIT"
          echo "commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          echo "calver=$CALVER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 2. Check if this version exists in YOUR registry
          MY_IMAGE="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}"
          echo "MY_IMAGE=$MY_IMAGE"
          echo "Checking tag: $VERSION"

          retry_manifest() {
            for i in {1..3}; do
              docker manifest inspect "$1" > /dev/null 2>&1 && return 0
              sleep 5
            done
            return 1
          }

          if retry_manifest "$MY_IMAGE:$VERSION"; then
            echo "Image exists."
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "summary=Image tag already exists in registry -> skip build" >> $GITHUB_OUTPUT
          else
            docker manifest inspect "$MY_IMAGE:$VERSION" || echo "inspect failed"
            echo "Update required."
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "summary=New Insiders commit not found in registry -> build" >> $GITHUB_OUTPUT
          fi

      - name: Job Summary
        if: always()
        run: |
          {
            echo "### Docker publish check"
            echo ""
            echo "- Insiders commit: \`${{ steps.check.outputs.version }}\`"
            echo "- Registry image: \`${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}\`"
            echo "- Needs update: \`${{ steps.check.outputs.needs_update }}\`"
            echo "- Result: ${{ steps.check.outputs.summary }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # JOB 2: BUILD & RELEASE
  # -------------------------------------------------------------------------
  build:
    needs: check-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout code
      packages: write # Required to push to GHCR
      id-token: write # Required for Cosign signing
      attestations: write # Required for GitHub artifact attestations
    # Logic: Run only when upstream version is new
    if: needs.check-upstream.outputs.needs_update == 'true'

    env:
      IMAGE_NAME: ${{ needs.check-upstream.outputs.image_name_lower }}
      TEST_TAG: localhost/${{ needs.check-upstream.outputs.image_name_lower }}:test

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log into Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-upstream.outputs.version }}
            type=raw,value=${{ needs.check-upstream.outputs.calver }}

      # BUILD 1: TEST (Load)
      - name: Build and Load (Test)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TEST_TAG }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEBUG=true
            UPSTREAM_VERSION=${{ needs.check-upstream.outputs.commit }}
            GITHUB_REPOSITORY=${{ github.repository }}

      - name: Scan for Vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.TEST_TAG }}
          format: "table"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Report only: don't fail CI on findings

      - name: Create Secret File
        run: echo "secret" > ${{ github.workspace }}/test-password.txt

      # STEP 2: HEALTHCHECK LOOP
      - name: Test Container
        run: |
          docker run -d --name testcontainer \
            -v ${{ github.workspace }}/test-password.txt:/run/secrets/user_password:ro \
            -e USER_PASSWORD_FILE=/run/secrets/user_password \
            -e DEBUG=true \
            "${{ env.TEST_TAG }}"

          for i in {1..30}; do
            HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' testcontainer)
            if [[ "$HEALTH" == "\"healthy\"" ]]; then
              echo "Container is healthy!"
              break
            fi
            if [[ "$i" -eq 30 ]]; then
              echo "Timeout waiting for healthcheck."
              docker logs testcontainer
              exit 1
            fi
            sleep 1
          done

          docker exec testcontainer doctl version || true
          docker exec testcontainer terraform version || true
          docker exec testcontainer /opt/code-insiders --version || true
          docker rm -f testcontainer

      # BUILD 2: RELEASE (Push)
      - name: Build and Push (Release)
        id: build-and-push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            DEBUG=true
            UPSTREAM_VERSION=${{ needs.check-upstream.outputs.commit }}
            GITHUB_REPOSITORY=${{ github.repository }}

      - name: Sign the Image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          cosign sign --yes "$IMAGE_URI"

  chart-release:
    needs: [ check-upstream, build ]
    if: needs.check-upstream.outputs.needs_update == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Update Chart appVersion
        run: |
          sed -i "s/^version:.*/version: \"${{ needs.check-upstream.outputs.version }}\"/" charts/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.check-upstream.outputs.version }}\"/" charts/Chart.yaml
          echo "Updated version and appVersion to ${{ needs.check-upstream.outputs.version }}"
          cat charts/Chart.yaml

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: create chart
        run: |
          helm package ./charts -d charts/
          helm repo index charts/ --url https://raw.githubusercontent.com/${{ github.repository }}/main/charts

          git add charts/
          git diff --staged --quiet || git commit -m "chore: update helm chart to ${{ needs.check-upstream.outputs.version }}"

          for i in {1..5}; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done

      - name: Job Summary
        if: always()
        run: |
          {
            echo "### Helm Chart Release"
            echo ""
            echo "- Chart: \`vscode-server-dockerized\`"
            echo "- Version: \`${{ needs.check-upstream.outputs.version }}\`"
            echo "- Repo URL: \`https://raw.githubusercontent.com/${{ github.repository }}/main/charts\`"
            echo "- Install: \`helm install vscode-server-dockerized --version ${{ needs.check-upstream.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
