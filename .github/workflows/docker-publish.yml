name: Docker

on:
  schedule:
    - cron: '27 2 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

# Add this block:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: microsoft/vscode

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: CHECK UPSTREAM VERSION
  # -------------------------------------------------------------------------
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout or API calls
      packages: read # Required to check existing images in GHCR
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      version: ${{ steps.check.outputs.version }}
      image_name_lower: ${{ steps.lowercase.outputs.image_name }}
    steps:
      # REQUIRED FIX: Docker registries crash on capital letters.
      - name: Lowercase Image Name
        id: lowercase
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Upstream & Registry
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking latest release for ${{ env.UPSTREAM_REPO }}..."
          
          # 1. Fetch latest tag from the defined upstream repo
          UPSTREAM_TAG=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" | jq -r ".tag_name")
          
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" == "null" ]; then
            echo "::error::Could not fetch upstream tag from ${{ env.UPSTREAM_REPO }}"
            exit 1
          fi
          
          echo "Latest upstream version: $UPSTREAM_TAG"
          echo "version=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          
          # 2. Check if this version exists in YOUR registry
          MY_IMAGE="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}"
          
          retry_manifest() {
            for i in {1..3}; do
              docker manifest inspect "$1" > /dev/null 2>&1 && return 0
              sleep 5
            done
            return 1
          }
          
          if retry_manifest "$MY_IMAGE:$UPSTREAM_TAG"; then
            echo "Image exists."
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Update required."
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi
          
  # -------------------------------------------------------------------------
  # JOB 2: BUILD & RELEASE
  # -------------------------------------------------------------------------
  build:
    needs: check-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read      # Required to checkout code
      packages: write     # Required to push to GHCR
      id-token: write     # Required for Cosign signing
      attestations: write # Required for GitHub artifact attestations
    # Logic: Run on Push/PR OR (Schedule AND update needed)
    if: |
      github.event_name != 'schedule' || 
      (github.event_name == 'schedule' && needs.check-upstream.outputs.needs_update == 'true')

    env:
      IMAGE_NAME: ${{ needs.check-upstream.outputs.image_name_lower }}
      TEST_TAG: localhost/${{ needs.check-upstream.outputs.image_name_lower }}:test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0 # no @v3 available!
        with:
          dockerfile: Dockerfile
          config: .hadolint.json

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      # BUILD 1: TEST (Load)
      - name: Build and Load (Test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TEST_TAG }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEBUG=true
            UPSTREAM_VERSION=${{ needs.check-upstream.outputs.version }}

      - name: Scan for Vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1  # Use latest stable version and no @v0 available!
        with:
          image-ref: ${{ env.TEST_TAG }}
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Fails the pipeline if Critical/High vulnerabilities
          
      - name: Create Secret File
        run: echo "secret" > ${{ github.workspace }}/test-password.txt

      # STEP 2: HEALTHCHECK LOOP
      - name: Test Container
        run: |
          docker run -d --name testcontainer \
            -v ${{ github.workspace }}/test-password.txt:/run/secrets/user_password:ro \
            -e USER_PASSWORD_FILE=/run/secrets/user_password \
            -e DEBUG=true \
            "${{ env.TEST_TAG }}"
          
          for i in {1..30}; do
            HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' testcontainer)
            if [[ "$HEALTH" == "\"healthy\"" ]]; then
              echo "Container is healthy!"
              break
            fi
            if [[ "$i" -eq 30 ]]; then
              echo "Timeout waiting for healthcheck."
              docker logs testcontainer
              exit 1
            fi
            sleep 1
          done
          
          docker exec testcontainer doctl version || true
          docker exec testcontainer terraform version || true
          docker exec testcontainer /opt/code-insiders --version || true
          docker rm -f testcontainer

      # BUILD 2: RELEASE (Push)
      - name: Build and Push (Release)
        id: build-and-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            DEBUG=true
            UPSTREAM_VERSION=${{ needs.check-upstream.outputs.version }}

      - name: Sign the Image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          cosign sign --yes "$IMAGE_URI"
