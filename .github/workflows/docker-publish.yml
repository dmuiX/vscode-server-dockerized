name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '27 2 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch tags and full history so metadata/tag detection works reliably
          fetch-depth: 0

      # Lint Dockerfile
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.json

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # Configure tag templates so images get predictable tags, including 'latest'
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For main branch, produce 'latest'
            type=ref,ref=refs/heads/main,format=latest
            # For other branches, produce branch-<name>
            type=ref,ref=refs/heads/*,format=branch-{{ref_name}}
            # For semver tags (vX.Y.Z) produce full version, major.minor, major
            type=semver,pattern=v*.*.*,format={{version}}
            type=semver,pattern=v*.*.*,format={{major}}.{{minor}}
            type=semver,pattern=v*.*.*,format={{major}}
            # Optionally make semver releases also update 'latest'
            type=semver,pattern=v*.*.*,format=latest
            # Always have a fallback short-sha tag
            type=sha,format={{short_sha}}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Adds more output to debug
          platforms: linux/amd64,linux/arm64
          build-args: |
            DEBUG=true

      # Normalize metadata output to a single primary image reference (first tag)
      - name: Set primary image reference
        id: set-image
        run: |
          TAGS='${{ steps.meta.outputs.tags }}'
          # Normalize separators (commas/spaces/newlines), remove empties, take the first tag
          IMAGE_REF=$(echo "$TAGS" | tr ',' '\n' | tr ' ' '\n' | sed '/^$/d' | head -n1)
          if [ -z "$IMAGE_REF" ]; then
            echo "No image tag detected in steps.meta.outputs.tags: [$TAGS]"
            exit 1
          fi
          echo "Detected IMAGE_REF=$IMAGE_REF"
          echo "IMAGE_REF=$IMAGE_REF" >> $GITHUB_ENV

      - name: Create password file from secret
        run: echo "secret" > ${{ github.workspace }}/test-password.txt

      - name: Test Container and Binaries
        run: |
          echo "Using image reference: $IMAGE_REF"
          docker run -d --name testcontainer \
            -v ${{ github.workspace }}/test-password.txt:/run/secrets/user_password:ro \
            -e USER_PASSWORD_FILE=/run/secrets/user_password \
            -e DEBUG=true \
            "$IMAGE_REF"
          
          # Give the container time to start up and become healthy
          echo "Waiting for container to become healthy..."
          sleep 15
          
          # Check health status and fail if not healthy
          docker inspect --format='{{json .State.Health}}' testcontainer | grep '"Status":"healthy"'
          
          echo "Container is healthy. Testing binaries..."
          # Test binaries inside the running container using docker exec
          docker exec testcontainer doctl version || true
          docker exec testcontainer terraform version || true
          docker exec testcontainer /opt/code-insiders --version || true
          
          echo "Tests passed. Final logs:"
          # Output container logs for debugging
          docker logs testcontainer || true
          
          # Clean up
          docker rm -f testcontainer || true
          
      - name: Inspect and Verify Docker Manifest
        run: |
          echo "Inspecting manifest for $IMAGE_REF"
          MANIFEST_JSON=$(docker manifest inspect "$IMAGE_REF")
          echo "${MANIFEST_JSON}"
          echo "${MANIFEST_JSON}" | grep '"architecture": "amd64"'
          echo "${MANIFEST_JSON}" | grep '"architecture": "arm64"'

      # Sign the resulting Docker image digest except on PRs.
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "No digest available from build-and-push outputs"
            exit 1
          fi
          echo "Signing ${IMAGE_REF}@${DIGEST}"
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"
