name: Docker Publish

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: CHECK UPSTREAM VERSION
  # -------------------------------------------------------------------------
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout or API calls
      packages: read # Required to check existing images in GHCR
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      needs_chart: ${{ steps.check.outputs.needs_chart }}
      version: ${{ steps.check.outputs.version }}
      chart_version: ${{ steps.check.outputs.chart_version }}
      calver: ${{ steps.check.outputs.calver }}
      commit: ${{ steps.check.outputs.commit }}
      image_name_lower: ${{ steps.lowercase.outputs.image_name }}
    steps:
      # REQUIRED FIX: Docker registries crash on capital letters.
      - name: Lowercase Image Name
        id: lowercase
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login to Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Upstream & Registry
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Authenticate the chart release lookup.
        run: |
          echo "Checking latest VSCode Insiders commit..."

          # 1. Fetch latest commit hash for Insiders (canonicalized to linux-x64)
          UPSTREAM_COMMIT=$(curl -sf "https://update.code.visualstudio.com/api/commits/insider/linux-x64" | jq -r '.[0]')

          if [ -z "$UPSTREAM_COMMIT" ] || [ "$UPSTREAM_COMMIT" == "null" ]; then
            echo "::error::Could not fetch VSCode Insiders commit hash"
            exit 1
          fi

          SHORT_COMMIT=${UPSTREAM_COMMIT:0:7}
          CALVER=$(date +%Y.%m.%d)
          VERSION="${CALVER}-${SHORT_COMMIT}"
          # Existing release bug (not an action migration): SemVer forbids leading
          # zeros in date components and numeric prereleases; preserve Docker tags.
          CHART_VERSION="${CALVER//.0/.}-sha${SHORT_COMMIT}"

          echo "Latest VSCode Insiders commit: $UPSTREAM_COMMIT"
          echo "commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          echo "calver=$CALVER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT

          # 2. Check if this version exists in YOUR registry
          MY_IMAGE="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}"
          echo "MY_IMAGE=$MY_IMAGE"
          echo "Checking tag: $VERSION"

          retry_manifest() {
            for i in {1..3}; do
              docker manifest inspect "$1" > /dev/null 2>&1 && return 0
              sleep 5
            done
            return 1
          }

          if retry_manifest "$MY_IMAGE:$VERSION"; then
            echo "Image exists."
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "summary=Image tag already exists in registry -> skip build" >> $GITHUB_OUTPUT
          else
            docker manifest inspect "$MY_IMAGE:$VERSION" || echo "inspect failed"
            echo "Update required."
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "summary=New Insiders commit not found in registry -> build" >> $GITHUB_OUTPUT
          fi

          # 3. Check if helm chart GitHub release for this version exists
          if gh release view "vscode-server-$CHART_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Helm chart release already exists."
            echo "needs_chart=false" >> $GITHUB_OUTPUT
          else
            echo "Helm chart release not found -> release needed."
            echo "needs_chart=true" >> $GITHUB_OUTPUT
          fi

      - name: Job Summary
        if: always()
        run: |
          {
            echo "### Docker publish check"
            echo ""
            echo "- Insiders commit: \`${{ steps.check.outputs.version }}\`"
            echo "- Registry image: \`${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}\`"
            echo "- Needs update: \`${{ steps.check.outputs.needs_update }}\`"
            echo "- Result: ${{ steps.check.outputs.summary }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # JOB 2: BUILD & RELEASE
  # -------------------------------------------------------------------------
  build:
    needs: check-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout code
      packages: write # Required to push to GHCR
      id-token: write # Required for Cosign signing
      attestations: write # Required for GitHub artifact attestations
    # Logic: Run only when upstream version is new
    if: needs.check-upstream.outputs.needs_update == 'true'

    env:
      IMAGE_NAME: ${{ needs.check-upstream.outputs.image_name_lower }}
      TEST_TAG: localhost/${{ needs.check-upstream.outputs.image_name_lower }}:test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-upstream.outputs.version }}
            type=raw,value=${{ needs.check-upstream.outputs.calver }}

      # BUILD 1: TEST (Load)
      - name: Build and Load (Test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TEST_TAG }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEBUG=true
            UPSTREAM_VERSION=${{ needs.check-upstream.outputs.commit }}
            GITHUB_REPOSITORY=${{ github.repository }}

      - name: Scan for Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_TAG }}
          format: "table"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Report only: don't fail CI on findings

      - name: Create Secret File
        run: echo "secret" > ${{ github.workspace }}/test-password.txt

      # STEP 2: HEALTHCHECK LOOP
      - name: Test Container
        run: |
          docker run -d --name testcontainer \
            -v ${{ github.workspace }}/test-password.txt:/run/secrets/user_password:ro \
            -e USER_PASSWORD_FILE=/run/secrets/user_password \
            -e DEBUG=true \
            "${{ env.TEST_TAG }}"

          for i in {1..30}; do
            HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' testcontainer)
            if [[ "$HEALTH" == "\"healthy\"" ]]; then
              echo "Container is healthy!"
              break
            fi
            if [[ "$i" -eq 30 ]]; then
              echo "Timeout waiting for healthcheck."
              docker logs testcontainer
              exit 1
            fi
            sleep 1
          done

          docker exec testcontainer doctl version || true
          docker exec testcontainer terraform version || true
          docker exec testcontainer /opt/code-insiders --version || true
          docker rm -f testcontainer

      # BUILD 2: RELEASE (Push)
      - name: Build and Push (Release)
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            DEBUG=true
            UPSTREAM_VERSION=${{ needs.check-upstream.outputs.commit }}
            GITHUB_REPOSITORY=${{ github.repository }}

      - name: Sign the Image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          cosign sign --yes "$IMAGE_URI"

  chart-release:
    needs: [ check-upstream, build ]
    if: |
      always() &&
      needs.check-upstream.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.check-upstream.outputs.needs_update == 'true' || needs.check-upstream.outputs.needs_chart == 'true')
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Update Chart version
        run: |
          VERSION="${{ needs.check-upstream.outputs.version }}"
          CHART_VERSION="${{ needs.check-upstream.outputs.chart_version }}"
          # Chart version must be SemVer; appVersion must retain the published image tag.
          sed -i "s/^version:.*/version: \"$CHART_VERSION\"/" charts/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/Chart.yaml
          git add charts/Chart.yaml
          git diff --staged --quiet || git commit -m "chore(helm): update chart to $CHART_VERSION"
          git pull --rebase origin main
          git push

      - name: Run chart-releaser
        id: chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: "."
          skip_existing: "true"
          mark_as_latest: "true"
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Sync README to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout main -- charts/README.md
          mv charts/README.md README.md
          rm -rf charts
          git add README.md
          git diff --staged --quiet || git commit -m "docs: sync README from main"
          git push origin gh-pages
          git checkout main

      - name: Job Summary
        if: always()
        run: |
          {
            echo "### Helm Chart Release"
            echo ""
            echo "- Chart version: \`${{ needs.check-upstream.outputs.chart_version }}\`"
            echo "- Changed charts: \`${{ steps.chart-releaser.outputs.changed_charts }}\`"
            echo "- Pages URL: \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\`"
          } >> "$GITHUB_STEP_SUMMARY"
