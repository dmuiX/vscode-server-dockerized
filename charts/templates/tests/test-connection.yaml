apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vscode-server.fullname" . }}-test-connection"
  labels:
    app.kubernetes.io/component: connection-test
    {{- include "vscode-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox
      # If NetworkPolicy is enabled, explicitly allow this test pod before helm test.
      # This internal check bypasses the proxy; user-facing authentication lives there.
      command: ['wget']
      args: ['-T', '180', '-O', '/dev/null', 'http://{{ include "vscode-server.fullname" . }}:{{ .Values.service.port }}/']
  restartPolicy: Never
